name: Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test Agent Configuration Validator
        run: python3 -m unittest discover -s scripts/tests -t . -p "test_*.py"

      - name: Validate Agent Configuration
        run: python3 scripts/check_agent_config.py

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Java 17 for Compatibility Tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Save Java 17 Toolchain
        shell: bash
        run: echo "EMBED_CODE_JAVA_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set Up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        run: >-
          ./gradlew
          -Dorg.gradle.java.installations.paths="$EMBED_CODE_JAVA_17_HOME"
          build :buildSrc:test :gradle-plugin:publishToMavenLocal

      - name: Verify Dependency Reports
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew generateDependencyReports
          git diff --exit-code -- dependencies.md pom.xml || {
            echo "::error::Dependency reports are stale. Run" \
              "./gradlew generateDependencyReports and commit the results."
            exit 1
          }
