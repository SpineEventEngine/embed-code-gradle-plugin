name: Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Java 17 for Compatibility Tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Save Java 17 Toolchain
        shell: bash
        run: echo "EMBED_CODE_JAVA_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set Up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        env:
          EMBED_CODE_REAL_TEST: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-latest' }}
        run: >-
          ./gradlew
          -Dorg.gradle.java.installations.paths="$EMBED_CODE_JAVA_17_HOME"
          build :gradle-plugin:publishToMavenLocal
